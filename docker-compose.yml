services:
  database:
    image: postgres:16
    environment:
      POSTGRES_DB: food_delivery
      POSTGRES_USER: food_delivery
      POSTGRES_PASSWORD: ${DB_PASSWORD:-food_delivery_dev}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U food_delivery -d food_delivery"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD", "cub", "zk-ready", "localhost:2181", "10"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server kafka:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  kafka-init:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    volumes:
      - ./kafka/create-topics.sh:/scripts/create-topics.sh:ro
    entrypoint: ["/bin/bash", "/scripts/create-topics.sh"]
    restart: "no"

  customer-service:
    build: ./services/customer-service
    ports:
      - "9091:9091"
    environment:
      DB_HOST: database
      DB_NAME: food_delivery
      DB_USER: food_delivery
      DB_PASSWORD: ${DB_PASSWORD:-food_delivery_dev}
    depends_on:
      database:
        condition: service_healthy

  restaurant-service:
    build: ./services/restaurant-service
    ports:
      - "9098:9098"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      DB_HOST: database
      DB_NAME: food_delivery
      DB_USER: food_delivery
      DB_PASSWORD: ${DB_PASSWORD:-food_delivery_dev}
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      database:
        condition: service_healthy

  order-service:
    build: ./services/order-service
    ports:
      - "9093:9093"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      DB_HOST: database
      DB_NAME: food_delivery
      DB_USER: food_delivery
      DB_PASSWORD: ${DB_PASSWORD:-food_delivery_dev}
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      database:
        condition: service_healthy

  payment-service:
    build: ./services/payment-service
    ports:
      - "9094:9094"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      DB_HOST: database
      DB_NAME: food_delivery
      DB_USER: food_delivery
      DB_PASSWORD: ${DB_PASSWORD:-food_delivery_dev}
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      database:
        condition: service_healthy

  delivery-service:
    build: ./services/delivery-service
    ports:
      - "9095:9095"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      DB_HOST: database
      DB_NAME: food_delivery
      DB_USER: food_delivery
      DB_PASSWORD: ${DB_PASSWORD:-food_delivery_dev}
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      database:
        condition: service_healthy

  notification-service:
    build: ./services/notification-service
    ports:
      - "9096:9096"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      DB_HOST: database
      DB_NAME: food_delivery
      DB_USER: food_delivery
      DB_PASSWORD: ${DB_PASSWORD:-food_delivery_dev}
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      database:
        condition: service_healthy

  admin-service:
    build: ./services/admin-service
    ports:
      - "9097:9097"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      DB_HOST: database
      DB_NAME: food_delivery
      DB_USER: food_delivery
      DB_PASSWORD: ${DB_PASSWORD:-food_delivery_dev}
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      database:
        condition: service_healthy

volumes:
  postgres_data:
