server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /api/customers {
        proxy_pass http://customer-service:9091/customers;
    }
    location /api/customers/ {
        proxy_pass http://customer-service:9091/customers/;
    }
    location = /api/orders {
        proxy_pass http://order-service:9093/orders;
    }
    location /api/orders/ {
        proxy_pass http://order-service:9093/orders/;
    }
    location = /api/restaurant {
        proxy_pass http://restaurant-service:9098/restaurant;
    }
    location /api/restaurant/ {
        proxy_pass http://restaurant-service:9098/restaurant/;
    }
    location = /api/delivery {
        proxy_pass http://delivery-service:9095/delivery;
    }
    location /api/delivery/ {
        proxy_pass http://delivery-service:9095/delivery/;
    }
    location = /api/notifications {
        proxy_pass http://notification-service:9096/notifications;
    }
    location /api/notifications/ {
        proxy_pass http://notification-service:9096/notifications/;
    }
    location = /api/admin {
        proxy_pass http://admin-service:9097/admin;
    }
    location /api/admin/ {
        proxy_pass http://admin-service:9097/admin/;
    }
    location = /api/payments {
        proxy_pass http://payment-service:9094/payments;
    }
    location /api/payments/ {
        proxy_pass http://payment-service:9094/payments/;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
